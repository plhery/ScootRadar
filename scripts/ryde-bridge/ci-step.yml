# Insert after npm test in .github/workflows/ci.yml when workflow-scoped auth is available.
- name: Ryde bridge protocol tests
  run: |
    python3 -m venv "$RUNNER_TEMP/ryde-tests"
    "$RUNNER_TEMP/ryde-tests/bin/pip" install -r scripts/ryde-bridge/requirements.txt
    PYTHONPATH=scripts/ryde-bridge "$RUNNER_TEMP/ryde-tests/bin/python" -m unittest discover -s scripts/ryde-bridge -p 'test_*.py' -v
