name: Android

# The Android app (android/), built and tested apart from ci.yml: the Deploy job there waits on none of
# this, so an Android run can neither hold back nor block a deploy of the website or the scooter cache.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'data/**'
      - 'ios/ScootRadar/*.lproj/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/country-catalog.mjs'
      - 'scripts/rental-links.mjs'
      - 'scripts/zone-downloads.mjs'
      - 'scripts/lime-grid.generated.mjs'
      - 'src/lib/limeGrid.ts'
      - 'src/lib/clustering.ts'
      - 'src/generated/countries.ts'
      - 'src/generated/timeZones.ts'
      - 'ios/ScootRadar/Models/*.generated.swift'
      - 'ios/ScootRadar/Models/*.generated.json'
      - 'ios/ScootRadar/Models/ScooterModels.swift'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  push:
    branches:
      - main
      - 'lane/android-*'
    paths:
      - 'android/**'
      - 'data/**'
      - 'ios/ScootRadar/*.lproj/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/country-catalog.mjs'
      - 'scripts/rental-links.mjs'
      - 'scripts/zone-downloads.mjs'
      - 'scripts/lime-grid.generated.mjs'
      - 'src/lib/limeGrid.ts'
      - 'src/lib/clustering.ts'
      - 'src/generated/countries.ts'
      - 'src/generated/timeZones.ts'
      - 'ios/ScootRadar/Models/*.generated.swift'
      - 'ios/ScootRadar/Models/*.generated.json'
      - 'ios/ScootRadar/Models/ScooterModels.swift'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # F-Droid builds the fdroid flavor with Debian's node 20 and tldts alone of the repository's npm packages
  # (android/fdroid/install-node-packages.mjs, and the build recipe in fdroiddata): the generators then write
  # what they write with all of them and node 26, byte for byte.
  fdroid-generators:
    name: F-Droid's generators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - run: |
          node android/fdroid/install-node-packages.mjs
          node scripts/generate-api-contract.mjs --kotlin="$RUNNER_TEMP/fdroid/api"
          node scripts/generate-provider-catalog.mjs --android="$RUNNER_TEMP/fdroid/catalog"
          rm -rf node_modules

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - run: |
          npm ci
          node scripts/generate-api-contract.mjs --kotlin="$RUNNER_TEMP/all/api"
          node scripts/generate-provider-catalog.mjs --android="$RUNNER_TEMP/all/catalog"
          diff -r "$RUNNER_TEMP/fdroid" "$RUNNER_TEMP/all"

  android:
    name: Android app
    runs-on: ubuntu-latest
    # The checks took 10 to 13 minutes on 14 November 2026 and up to 19 on the 18th, as the tests grew.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build runs the website's generators for the catalog and the API contract (android/core).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci
        working-directory: .

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # verifyRoborazziPlayDebug has the JVM tests compare their screenshots with the baselines recorded on the
      # Mac (android/app/src/test/screenshots). All their text is the bundled Inter, so Linux's fonts don't enter.
      # assemblePlayRelease runs R8 and the resource shrinker over the release build, unsigned (X-AD30).
      # The fdroid build, for F-Droid's catalog: its own test, after the check that it ships no library of Google's
      # (checkFdroidReleaseAdvertisingId), and its release build, as F-Droid builds it.
      - run: >-
          ./gradlew --console=plain :core:test :core:animalsnifferMain
          :app:testPlayDebugUnitTest :app:verifyRoborazziPlayDebug :app:lintPlayDebug :app:assemblePlayDebug :app:assemblePlayRelease
          :app:testFdroidDebugUnitTest --tests com.plhery.scootradar.MainActivityStoreReviewTest :app:assembleFdroidRelease

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-diffs
          path: android/app/build/outputs/roborazzi
          if-no-files-found: ignore
