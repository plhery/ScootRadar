name: Scooter catalog check

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      # Fails when an entry of a country's catalog is gone (HTTP 401, 404 or 410).
      # A paused Dott region (403 ERR_REGION_OFFLINE) and other failures are only in the log.
      - run: npm run check:catalogs -- --fail-on=gone
      # Fails when a hand-kept price of data/listed-prices.json is due a recheck, or its page is gone.
      - if: ${{ !cancelled() }}
        run: npm run check:listed-prices -- --fail-on=stale
