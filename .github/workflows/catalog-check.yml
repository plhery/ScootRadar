name: Scooter catalog check

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          # This job installs no packages, so there is no npm cache to keep, which packageManager in
          # package.json would otherwise turn on.
          package-manager-cache: false
      # Fails when an entry of a country's catalog is gone (HTTP 401, 404 or 410). A paused Dott
      # region (403 ERR_REGION_OFFLINE), a feed in its catalog's seasonal window and other failures
      # are only in the log. The app maps' states, and those of NRW.Mobidrom's feeds, come from the
      # scooter cache's /feeds (--apps=cache): only the cache holds the app sessions, which rotate on
      # renewal, and Mobidrom's OAuth token, so this job runs no app map client. A failing one is
      # only logged, as the cache's own alerts already report it.
      - run: npm run check:catalogs -- --fail-on=gone --apps=cache
      # Fails when a hand-kept price of data/listed-prices.json is due a recheck, or its page is gone.
      - if: ${{ !cancelled() }}
        run: npm run check:listed-prices -- --fail-on=stale
