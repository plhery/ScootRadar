name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to a pull request cancels its run. On main a run that has started ends, as only that
# deploys (DEPLOY.md), and runs go one at a time: of the pushes made meanwhile only the newest waits,
# GitHub cancelling a waiting run when another queues, and its commit carries the others. When each
# commit ran, the 15 pushed in 40 minutes on 24 Oct 2026 kept iOS jobs waiting up to 15 minutes for one
# of the account's five Macs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web:
    name: Web and backend
    runs-on: ubuntu-latest
    # 9 to 13 minutes as a rule while it ran the end-to-end tests too (24 Oct 2026).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run check:providers
      - run: npm run check:api-contract
      - run: npm run lint
      - run: npm test
      - run: docker build -f server/Dockerfile -t scooter-cache:ci .
      - run: npm run cf-typegen
      - run: npx opennextjs-cloudflare build

  # Each browser on a runner of its own, which spreads its tests over two workers (playwright.config.ts):
  # on one runner, both took 6.5 to 10 minutes on 24 Oct 2026, mobile WebKit's app.e2e.ts 6.1 of them.
  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    # 20 left no room for a slow package mirror (see below), which ran three runs out of time on
    # 22 Oct 2026.
    timeout-minutes: 30
    strategy:
      # Both browsers report, even when one fails.
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      # The runners list Azure's Ubuntu mirror first, then Ubuntu's own archive. On 22 Oct 2026 Azure's
      # stalled 30 s on one package in ten, and Playwright's 181 system packages took up to 20 minutes
      # instead of one, so take them from Ubuntu's archive, while the list names another mirror.
      - name: Skip Azure's Ubuntu mirror
        run: |
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ] && grep -qv 'azure\.archive\.ubuntu\.com' "$mirrors"; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
          fi
          cat "$mirrors" || true
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.project }}

  ios:
    name: iOS
    runs-on: macos-26
    # 10.5 to 13 minutes as a rule since the tests run without clones (24 Oct 2026). On clones they
    # took up to 23 on a slow runner, and three runs ran out of 20 on 22 Oct 2026.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runner images don't always carry the simulator the tests used to name, and on 18 Oct 2026
      # (6ffba80) one carried none, so take an iPhone on the newest iOS runtime, preferring the
      # iPhone 17 Pro, create one if the runtime has none, and skip the tests with a warning if
      # the runner has no iOS runtime at all.
      - name: Pick a simulator
        id: simulator
        run: |
          set -uo pipefail
          runtimes=$(xcrun simctl list runtimes available --json || echo '{}')
          devices=$(xcrun simctl list devices available --json || echo '{}')
          # shellcheck disable=SC2016
          newest_first='[($runtimes.runtimes // [])[] | select(.platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | reverse'
          udid=$(jq -rn --argjson runtimes "$runtimes" --argjson devices "$devices" "$newest_first"'
            | map(. as $runtime | ($devices.devices[$runtime.identifier] // [])
                | map(select(.name | contains("iPhone"))) | sort_by(.name != "iPhone 17 Pro"))
            | flatten | first | .udid // empty')
          if [ -z "$udid" ]; then
            read -r runtime devicetype < <(jq -rn --argjson runtimes "$runtimes" "$newest_first"'
              | first // empty
              | [.identifier, ((.supportedDeviceTypes // []) | map(select(.productFamily == "iPhone")) | first | .identifier // empty)]
              | select(length == 2) | join(" ")') || true
            if [ -n "${devicetype:-}" ]; then
              udid=$(xcrun simctl create "CI iPhone" "$devicetype" "$runtime") || udid=""
            fi
          fi
          if [ -z "$udid" ]; then
            echo "::warning title=iOS tests skipped::This runner has no iOS simulator and none could be created."
            echo "iOS tests skipped: the runner had no iOS simulator." >> "$GITHUB_STEP_SUMMARY"
          else
            xcrun simctl list devices | grep "$udid" || true
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The scheme runs the tests in parallel on clones of the simulator. On 24 Oct 2026 the first
      # clone ran nearly all of them while the others booted on the runner's three cores, and one
      # that could not launch the app kept the run waiting: testing took 13 to 16 minutes for 4 to
      # 8 minutes of tests. So they run on the simulator itself.
      - name: Run iOS tests
        if: steps.simulator.outputs.udid != ''
        run: >-
          xcodebuild test
          -project ios/ScootRadar.xcodeproj
          -scheme ScootRadar
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -derivedDataPath "$RUNNER_TEMP/ScootRadarDerivedData"
          -resultBundlePath "$RUNNER_TEMP/ScootRadar.xcresult"
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO

      # The result bundle has the failures' messages, those of expected failures as well.
      - name: Show the tests' failures
        if: always() && steps.simulator.outputs.udid != ''
        run: |
          set -uo pipefail
          bundle="$RUNNER_TEMP/ScootRadar.xcresult"
          [ -d "$bundle" ] || exit 0
          xcrun xcresulttool get test-results tests --path "$bundle" --compact \
            | jq -r '.. | objects | select(.nodeType? == "Test Case" and (.result == "Failed" or .result == "Expected Failure"))
                | "\(.result): \(.nodeIdentifier // .name)",
                  ([.. | objects | select(.nodeType? == "Failure Message" or .nodeType? == "Expected Failure") | "  \(.name)"] | unique | .[])' \
            || true

  # Production deploys from two branches only this job moves (DEPLOY.md): Workers Builds deploys
  # production, the website and its Worker, and Coolify production-cache, the scooter cache. So a
  # commit deploys once the jobs above have passed on it, and not at all if one fails.
  # Once the website is live, IndexNow hears of the pages added to the sitemap or redated since it
  # last took them.
  deploy:
    name: Deploy
    needs: [web, e2e, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SITE: https://scootradar.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch and commit, but the files of this commit only, to compare production-cache with it.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          # This job installs no packages, so there is no npm cache to keep, which packageManager in
          # package.json would otherwise turn on.
          package-manager-cache: false

      - name: Move the production branches
        id: deploy
        run: node scripts/deploy-after-ci.mjs

      # Workers Builds deploys production a minute or two after it moves. It names the build after
      # the commit (next.config.ts), and every page carries that name, so the website is the commit
      # production is at once the landing page holds it: this one, or a later one that carries it
      # (a re-run, or a later commit's job that ended first). Deploy jobs run one at a time. When it
      # never does, the Workers build failed or hangs, and only Cloudflare's dashboard shows it, so
      # the job fails rather than warns.
      - name: Wait for the website to serve production
        id: live
        if: steps.deploy.outputs.website != ''
        timeout-minutes: 9
        env:
          BUILD: ${{ steps.deploy.outputs.website }}
        run: |
          deadline=$((SECONDS + 480))
          while (( SECONDS < deadline )); do
            page=$(curl --silent --max-time 20 -H 'Cache-Control: no-cache' "$SITE/" || true)
            if [[ "$page" == *"$BUILD"* ]]; then
              echo "$SITE serves ${BUILD::7} after $SECONDS seconds."
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Website not deployed::$SITE did not serve ${BUILD::7} within 8 minutes: see its Workers build in Cloudflare's dashboard (Workers & Pages › swiss-scooters › Deployments). IndexNow was not told; the next deploy tells it of the pages, or once the site serves it, run: node scripts/indexnow.mjs --since=refs/indexnow/submitted $SITE"
          exit 1

      # The pages new or redated in the sitemap since IndexNow last took them go to it, which Bing
      # and the engines that use its index read (scripts/indexnow.mjs). refs/indexnow/submitted keeps
      # the sitemap it took, and moves only once it takes them all, so pages a deploy could not send
      # go with the next. A refusal is shown but never fails the deploy.
      - name: Tell IndexNow about new and redated pages
        if: steps.live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/indexnow.mjs --since=refs/indexnow/submitted "$SITE"
