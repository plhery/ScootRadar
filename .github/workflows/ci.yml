name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to a pull request cancels its run; each commit on main runs to the end, so it can deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web and backend
    runs-on: ubuntu-latest
    # 12 to 16 minutes as a rule, 10 to 13 of them end-to-end tests, so 20 left no room for a slow
    # package mirror (see below), which ran three runs out of time on 22 Oct 2026.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run check:providers
      - run: npm run check:api-contract
      - run: npm run lint
      - run: npm test
      - run: docker build -f server/Dockerfile -t scooter-cache:ci .
      # The runners list Azure's Ubuntu mirror first, then Ubuntu's own archive. On 22 Oct 2026 Azure's
      # stalled 30 s on one package in ten, and Playwright's 181 system packages took up to 20 minutes
      # instead of one, so take them from Ubuntu's archive, while the list names another mirror.
      - name: Skip Azure's Ubuntu mirror
        run: |
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ] && grep -qv 'azure\.archive\.ubuntu\.com' "$mirrors"; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
          fi
          cat "$mirrors" || true
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run cf-typegen
      - run: npx opennextjs-cloudflare build

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runner images don't always carry the simulator the tests used to name, and on 18 Oct 2026
      # (6ffba80) one carried none, so take an iPhone on the newest iOS runtime, preferring the
      # iPhone 17 Pro, create one if the runtime has none, and skip the tests with a warning if
      # the runner has no iOS runtime at all.
      - name: Pick a simulator
        id: simulator
        run: |
          set -uo pipefail
          runtimes=$(xcrun simctl list runtimes available --json || echo '{}')
          devices=$(xcrun simctl list devices available --json || echo '{}')
          # shellcheck disable=SC2016
          newest_first='[($runtimes.runtimes // [])[] | select(.platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | reverse'
          udid=$(jq -rn --argjson runtimes "$runtimes" --argjson devices "$devices" "$newest_first"'
            | map(. as $runtime | ($devices.devices[$runtime.identifier] // [])
                | map(select(.name | contains("iPhone"))) | sort_by(.name != "iPhone 17 Pro"))
            | flatten | first | .udid // empty')
          if [ -z "$udid" ]; then
            read -r runtime devicetype < <(jq -rn --argjson runtimes "$runtimes" "$newest_first"'
              | first // empty
              | [.identifier, ((.supportedDeviceTypes // []) | map(select(.productFamily == "iPhone")) | first | .identifier // empty)]
              | select(length == 2) | join(" ")') || true
            if [ -n "${devicetype:-}" ]; then
              udid=$(xcrun simctl create "CI iPhone" "$devicetype" "$runtime") || udid=""
            fi
          fi
          if [ -z "$udid" ]; then
            echo "::warning title=iOS tests skipped::This runner has no iOS simulator and none could be created."
            echo "iOS tests skipped: the runner had no iOS simulator." >> "$GITHUB_STEP_SUMMARY"
          else
            xcrun simctl list devices | grep "$udid" || true
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run iOS tests
        if: steps.simulator.outputs.udid != ''
        run: >-
          xcodebuild test
          -project ios/ScootRadar.xcodeproj
          -scheme ScootRadar
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -derivedDataPath "$RUNNER_TEMP/ScootRadarDerivedData"
          CODE_SIGNING_ALLOWED=NO

  # Production deploys from two branches only this job moves (DEPLOY.md): Workers Builds deploys
  # production, the website and its Worker, and Coolify production-cache, the scooter cache. So a
  # commit deploys once both jobs above have passed on it, and not at all if one fails.
  # Once the website is live, IndexNow hears of the pages it added to the sitemap or redated.
  deploy:
    name: Deploy
    needs: [web, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SITE: https://scootradar.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch and commit, but the files of this commit only, to compare production-cache with it.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # IndexNow hears of the pages this deploy adds to the sitemap or redates: the live one is
      # kept to compare with. Without it, IndexNow is told nothing; the deploy goes ahead.
      - name: Save the sitemap before the deploy
        continue-on-error: true
        timeout-minutes: 1
        run: |
          curl --silent --show-error --fail --max-time 20 -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/sitemap-before.xml" "$SITE/sitemap.xml" \
            || { rm -f "$RUNNER_TEMP/sitemap-before.xml"; echo '::warning::The sitemap could not be saved: IndexNow will hear of no pages.'; }

      - name: Move the production branches
        id: deploy
        run: node scripts/deploy-after-ci.mjs

      # Workers Builds deploys production a minute or two after it moves. It names the build after
      # the commit (next.config.ts), and every page carries that name, so the website is this
      # commit once the landing page holds it. The next Deploy job waits for this one, so it
      # saves the sitemap this one put live.
      - name: Wait for the website to serve this commit
        id: live
        if: steps.deploy.outputs.website == 'moved'
        continue-on-error: true
        timeout-minutes: 9
        run: |
          deadline=$((SECONDS + 480))
          while (( SECONDS < deadline )); do
            page=$(curl --silent --max-time 20 -H 'Cache-Control: no-cache' "$SITE/" || true)
            if [[ "$page" == *"$GITHUB_SHA"* ]]; then
              echo "$SITE serves ${GITHUB_SHA::7} after $SECONDS seconds."
              exit 0
            fi
            sleep 15
          done
          echo "::warning title=IndexNow not told::$SITE did not serve ${GITHUB_SHA::7} within 8 minutes. Once it does, run: node scripts/indexnow.mjs --all $SITE"
          exit 1

      # The pages new or redated in the sitemap go to IndexNow, which Bing and the engines that use
      # its index read (scripts/indexnow.mjs). A refusal is shown but never fails the deploy.
      - name: Tell IndexNow about new and redated pages
        if: steps.live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/indexnow.mjs "--before=$RUNNER_TEMP/sitemap-before.xml" "$SITE"
